name: MLXPlatform
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
  textual:
    url: https://github.com/gonzalezreal/textual.git
    exactVersion: 0.5.0
schemes:
  MLXVLMServer:
    build:
      targets:
        MLXVLMServer: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  MLXServerKit:
    type: framework
    platform: macOS
    configFiles:
      Debug: Configuration/Signing.xcconfig
      Release: Configuration/Signing.xcconfig
    sources:
      - path: Sources/MLXServerKit
    postBuildScripts:
      - name: Build mlx-vlm-server resource
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          MLX_VLM_MAIN_CHECKOUT="$SRCROOT/../mlx-vlm"
          if [ -d "$MLX_VLM_MAIN_CHECKOUT/.git" ] && command -v git >/dev/null 2>&1; then
            echo "Using local mlx-vlm checkout: $MLX_VLM_MAIN_CHECKOUT ($(git -C "$MLX_VLM_MAIN_CHECKOUT" branch --show-current))"
            export MLX_VLM_SOURCE_PATH="$MLX_VLM_MAIN_CHECKOUT"
          fi
          python3 "$SRCROOT/PythonDistribution/Scripts/build_xcode_framework_resource.py"
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: $(MLX_SERVER_KIT_BUNDLE_IDENTIFIER)
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  MLXVLMServer:
    type: application
    platform: macOS
    configFiles:
      Debug: Configuration/Signing.xcconfig
      Release: Configuration/Signing.xcconfig
    sources:
      - path: Sources/MLXVLMServer
        excludes:
          - ModelProviderIcons
      - path: Sources/MLXVLMServer/ModelProviderIcons
        type: folder
        buildPhase: resources
    dependencies:
      - target: MLXServerKit
      - package: Sparkle
        product: Sparkle
      - package: textual
        product: Textual
    settings:
      base:
        ARCHS: arm64
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: $(MLX_VLM_SERVER_BUNDLE_IDENTIFIER)
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/MLXVLMServer-Info.plist
        MARKETING_VERSION: 0.2.1
        CURRENT_PROJECT_VERSION: 3
