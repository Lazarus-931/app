name: MLXPlatform
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
targets:
  MLXServerKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/MLXServerKit
    postBuildScripts:
      - name: Build mlx-vlm-server resource
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          MLX_VLM_MAIN_CHECKOUT="$SRCROOT/../mlx-vlm"
          if [ -d "$MLX_VLM_MAIN_CHECKOUT/.git" ] && command -v git >/dev/null 2>&1; then
            echo "Using local mlx-vlm checkout: $MLX_VLM_MAIN_CHECKOUT ($(git -C "$MLX_VLM_MAIN_CHECKOUT" branch --show-current))"
            export MLX_VLM_SOURCE_PATH="$MLX_VLM_MAIN_CHECKOUT"
          fi
          python3 "$SRCROOT/PythonDistribution/Scripts/build_xcode_framework_resource.py"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.MLXServerKit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: NO
  MLXServerDemo:
    type: application
    platform: macOS
    sources:
      - path: Sources/MLXServerDemo
    dependencies:
      - target: MLXServerKit
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.MLXServerDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHighResolutionCapable: YES
