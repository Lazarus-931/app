name: Dev Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache bundled mlx-vlm server distribution
        uses: actions/cache@v4
        with:
          path: |
            dist/mlx-vlm-server
            .cache/python-build-standalone
          key: mlx-vlm-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('PythonDistribution/**') }}

      - name: Cache Swift package dependencies
        uses: actions/cache@v4
        with:
          path: build/NativDevelopmentDerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Build app (unsigned Debug)
        run: make xcode-build

      - name: Run focused chat image model tests
        run: |
          xcodebuild \
            -project Nativ.xcodeproj \
            -scheme Nativ \
            -configuration Debug \
            -derivedDataPath build/NativDevelopmentDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:NativTests/ChatToolRegistryTests \
            -only-testing:NativTests/ChatImageModelSelectionGateTests \
            -only-testing:NativTests/ChatTranscriptMessageCodableTests \
            -only-testing:NativTests/LocalModelDiscoveryTests \
            -only-testing:NativTests/MLXImageModelResolverTests \
            test

      - name: Package Agent -2 review app
        run: |
          set -euo pipefail
          products=build/NativDevelopmentDerivedData/Build/Products/Debug
          mv "$products/Nativ.app" "$products/Nativ-issue-131.app"
          ditto -c -k --keepParent \
            "$products/Nativ-issue-131.app" \
            "$products/Nativ-issue-131.zip"

      - name: Upload Agent -2 review app
        uses: actions/upload-artifact@v4
        with:
          name: Nativ-issue-131-${{ github.sha }}
          path: build/NativDevelopmentDerivedData/Build/Products/Debug/Nativ-issue-131.zip
          retention-days: 7
