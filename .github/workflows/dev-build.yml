name: Dev Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache bundled mlx-vlm server distribution
        uses: actions/cache@v4
        with:
          path: |
            dist/mlx-vlm-server
            .cache/python-build-standalone
          key: mlx-vlm-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('PythonDistribution/**') }}

      - name: Cache Swift package dependencies
        uses: actions/cache@v4
        with:
          path: build/XcodeDerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Build app (unsigned Debug)
        run: make xcode-build

      - name: Run chat transcript tests
        run: |
          xcodebuild \
            -project Nativ.xcodeproj \
            -scheme Nativ \
            -configuration Debug \
            -derivedDataPath build/XcodeDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:NativTests/ChatViewModelTests \
            test

      - name: Package review app
        run: |
          set -euo pipefail
          products=build/XcodeDerivedData/Build/Products/Debug
          mv "$products/Nativ.app" "$products/Nativ-pr452.app"
          ditto -c -k --keepParent \
            "$products/Nativ-pr452.app" \
            "$products/Nativ-pr452.zip"

      - name: Upload review app
        uses: actions/upload-artifact@v4
        with:
          name: Nativ-pr452-${{ github.sha }}
          path: build/XcodeDerivedData/Build/Products/Debug/Nativ-pr452.zip
          retention-days: 7
