name: Dev Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache bundled mlx-vlm server distribution
        uses: actions/cache@v4
        with:
          path: |
            dist/mlx-vlm-server
            .cache/python-build-standalone
          key: mlx-vlm-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('PythonDistribution/**') }}

      - name: Cache Swift package dependencies
        uses: actions/cache@v4
        with:
          path: build/XcodeDerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Build app (unsigned Debug)
        run: make xcode-build

      - name: Run focused startup and model release tests
        run: |
          xcodebuild \
            -project Nativ.xcodeproj \
            -scheme Nativ \
            -configuration Debug \
            -derivedDataPath build/NativDevelopmentDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:NativTests/NativSettingsTests/testServerStartupModeRoundTripsWithoutChangingLaunchConfiguration \
            -only-testing:NativTests/NativSettingsTests/testMissingServerStartupModePreservesAutomaticStartup \
            -only-testing:NativTests/NativSettingsTests/testLegacyServerStartupModesMigrateToAutomatic \
            -only-testing:NativTests/NativSettingsTests/testModelManagementClientCallsAuthenticatedUnloadEndpoint \
            test

      - name: Zip app bundle
        run: |
          set -euo pipefail
          cd build/NativDevelopmentDerivedData/Build/Products/Debug
          ditto -c -k --keepParent Nativ.app Nativ-server-startup-controls.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nativ-server-startup-controls-${{ github.sha }}
          path: build/NativDevelopmentDerivedData/Build/Products/Debug/Nativ-server-startup-controls.zip
          retention-days: 7
